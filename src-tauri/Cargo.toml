[package]
name = "tauri-exam-app"
version = "1.0.0"
description = "Offline exam practice desktop application"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "tauri_exam_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
thiserror = "1"
log = "0.4"
env_logger = "0.11"

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
